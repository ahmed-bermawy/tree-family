name: CI/CD - Backend API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude=node_modules --exclude=.env --exclude=.git
          path: ./*
          remote_user: ${{ secrets.FT_API_USER }}
          remote_host: ${{ secrets.FT_API_HOST }}
          remote_port: ${{ secrets.FT_API_PORT }}
          remote_key: ${{ secrets.FT_API_SSH_KEY }}
          remote_path: ${{ secrets.FT_API_PATH }}
